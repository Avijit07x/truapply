[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "satyaapply"
version = "0.1.0.dev0"
description = "Local, honest job-application assistant powered by Claude Code"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["playwright>=1.50"]

[project.optional-dependencies]
dev = ["ruff>=0.14", "mypy>=1.18", "pytest>=8.4", "pytest-cov>=7", "pre-commit>=4"]

[project.scripts]
satyaapply = "satyaapply.cli:main"

[tool.setuptools.packages.find]
include = ["satyaapply*"]

[tool.setuptools.package-data]
satyaapply = ["resume/*.css", "apply/*.js", "sources/*.csv"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "B", "UP", "S", "SIM", "C90", "PTH", "RUF",
  "T20", "ERA", "PL", "ARG", "RET", "TRY", "PERF",
]
ignore = ["TRY003"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 4
max-statements = 40

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004"]
"satyaapply/cli.py" = ["T20"]
"satyaapply/doctor.py" = ["T20"]
"satyaapply/onboarding/*" = ["T20"]
"tools/*" = ["T20"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["satyaapply", "tools", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "ai: calls the real Claude Code CLI",
  "e2e: drives a real headless browser on local pages",
  "network: calls real public job-board APIs",
]
addopts = "-m 'not ai and not network'"

[tool.coverage.run]
source = ["satyaapply"]

[tool.coverage.report]
include = [
  "satyaapply/store/*",
  "satyaapply/resume/*",
  "satyaapply/ai/*",
  "satyaapply/core/*",
]
omit = ["satyaapply/resume/render.py"]
fail_under = 80
show_missing = true
